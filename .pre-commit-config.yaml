# Хуки запускаются перед коммитом — те же проверки, что в CI (ruff).
# Установка: pip install -e ".[dev]" && pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
