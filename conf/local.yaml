# Локальная разработка: bot и webapp на хосте, Postgres в Docker (localhost:5432).
# При полном стеке в Docker у сервиса bot DATABASE_HOST=postgres задаётся через env.
# Секреты (токен бота) — только через .env / переменные окружения.

app:
  name: hack-max
  debug: true

logging:
  level: DEBUG
  format: console

database:
  host: localhost
  port: 5432
  name: hack_max
  user: hack_max
  password: hack_max
  echo: false
  pool_size: 10
  max_overflow: 20

max:
  api_base_url: https://botapi.max.ru

docs:
  url: https://alexeyv07.github.io/hack_max/docs/
  github_url: https://github.com/Alexeyv07/hack_max

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - http://127.0.0.1:4173

events:
  nearby_radius_m: 6000
  city_radius_m: 30000

# KAN-19: дедуп / актуализация (окно «ещё активна» = 21 день)
ml_dedup:
  enabled: true
  active_days: 21
  duplicate_threshold: 0.82
  update_threshold: 0.58
  radius_m: 3000
  allow_hash_fallback: true
  require_geo_match: false
  queue_maxsize: 500

# time-window ML + place NER (spaCy → addresses)
ml_enrich:
  time_enabled: true
  time_min_confidence: 0.45
  place_enabled: true
  spacy_model: ru_core_news_md

runtime:
  enable_bot: true
  enable_api: true
  enable_news_parser: true
  enable_mc_parser: true
  enable_chat_parser: true

# KAN-10: минимальный фильтр (важность — classify ML)
chat_parser:
  enabled: true
  min_chars: 3
  flood_window_seconds: 90
  flood_max_repeats: 3
  updates_limit: 50
  photo_attach_window_seconds: 600
  greeting_only:
    - привет
    - здравствуйте
    - здарова
    - добрый день
    - добрый вечер
    - доброе утро
    - привет всем
    - всем привет
    - ку
    - хай
    - ок
    - окей
    - ладно

news_parser:
  # production: лёгкий backfill + incremental. bootstrap с soft-cap 0 душит API/бота.
  mode: production
  lookback_days: 3
  poll_interval_seconds: 300
  request_timeout_seconds: 15
  collect_timeout_seconds: 90
  max_articles_per_source_per_run: 15
  max_pages_per_run: 3
  bootstrap_articles_per_source: 50
  bootstrap_snapshot_path: src/parser_common/data/bootstrap_events.jsonl.gz
  insert_batch_size: 10
  early_stop_known_streak: 10
  source_pause_seconds: 1.0
  backfill_pause_seconds: 3.0
  user_agent: "HackMaxNewsBot/1.0"
  sources:
    tass:
      enabled: true
      feed_url: "https://tass.ru/rss/v2.xml"
      reliability: 0.92
    ria:
      enabled: true
      feed_url: "https://ria.ru/export/rss2/index.xml"
      reliability: 0.90
    kommersant:
      enabled: true
      listing_url: "https://www.kommersant.ru/rubric/6"
      archive_url: "https://www.kommersant.ru/archive/?date={date}"
      reliability: 0.88
    msk1:
      enabled: true
      feed_url: "https://msk1.ru/rss-feeds/rss.xml"
      listing_url: "https://msk1.ru/text/?page={page}"
      reliability: 0.82
    mskagency:
      enabled: true
      listing_url: "https://www.mskagency.ru/lenta"
      reliability: 0.80
    m24:
      enabled: true
      feed_url: "https://www.m24.ru/rss.xml"
      listing_url: "https://www.m24.ru/news"
      reliability: 0.85

mc_parser:
  mode: production
  lookback_days: 3
  poll_interval_seconds: 300
  request_timeout_seconds: 20
  collect_timeout_seconds: 90
  max_articles_per_source_per_run: 10
  max_pages_per_run: 2
  bootstrap_articles_per_source: 30
  insert_batch_size: 10
  early_stop_known_streak: 8
  source_pause_seconds: 1.0
  backfill_pause_seconds: 3.0
  user_agent: "HackMaxMcBot/1.0"
  sources:
    pik_comfort:
      enabled: true
      listing_url: "https://pik-comfort.ru/news_all"
      reliability: 0.88
    granel:
      enabled: true
      listing_url: "https://www.ggkm.ru/news/"
      reliability: 0.80
    zhil_nagatino:
      enabled: true
      listing_url: "https://www.gbuns.ru/organizacia/novosti"
      reliability: 0.90
    gbu_portal:
      enabled: true
      listing_url: "https://gbu-zhilishchnik.ru/novosti"
      reliability: 0.78
    moek:
      enabled: true
      listing_url: "https://www.moek.ru/press/news/"
      reliability: 0.92
