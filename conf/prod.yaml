# Прод-конфиг без секретов.
# Задавайте через env: MAX_BOT_TOKEN, DATABASE_PASSWORD, DATABASE_HOST, ...

app:
  name: hack-max
  debug: false

logging:
  level: INFO
  format: console

database:
  host: localhost
  port: 5432
  name: hack_max
  user: hack_max
  echo: false
  pool_size: 10
  max_overflow: 20

max:
  api_base_url: https://botapi.max.ru

docs:
  url: https://alexeyv07.github.io/hack_max/docs/
  github_url: https://github.com/Alexeyv07/hack_max

api:
  host: 0.0.0.0
  port: 8000

events:
  nearby_radius_m: 3000
  city_radius_m: 30000

ml_dedup:
  enabled: true
  active_days: 21
  duplicate_threshold: 0.82
  update_threshold: 0.58
  radius_m: 3000
  allow_hash_fallback: true
  require_geo_match: false
  queue_maxsize: 500

ml_enrich:
  time_enabled: true
  time_min_confidence: 0.45
  place_enabled: true
  spacy_model: ru_core_news_md

runtime:
  enable_bot: true
  enable_api: true
  enable_news_parser: true
  enable_mc_parser: true

news_parser:
  mode: production
  lookback_days: 21
  poll_interval_seconds: 3600
  request_timeout_seconds: 30
  collect_timeout_seconds: 180
  max_articles_per_source_per_run: 30
  max_pages_per_run: 10
  bootstrap_articles_per_source: 0
  insert_batch_size: 25
  early_stop_known_streak: 15
  source_pause_seconds: 0.5
  backfill_pause_seconds: 2.0
  user_agent: "HackMaxNewsBot/1.0"
  sources:
    tass:
      enabled: true
      feed_url: "https://tass.ru/rss/v2.xml"
      reliability: 0.70
    ria:
      enabled: true
      feed_url: "https://ria.ru/export/rss2/index.xml"
      reliability: 0.65
    kommersant:
      enabled: true
      listing_url: "https://www.kommersant.ru/rubric/6"
      archive_url: "https://www.kommersant.ru/archive/?date={date}"
      reliability: 0.75
    msk1:
      enabled: true
      feed_url: "https://msk1.ru/rss-feeds/rss.xml"
      listing_url: "https://msk1.ru/text/?page={page}"
      reliability: 0.95
    mskagency:
      enabled: true
      listing_url: "https://www.mskagency.ru/lenta"
      reliability: 0.85
    m24:
      enabled: true
      feed_url: "https://www.m24.ru/rss.xml"
      listing_url: "https://www.m24.ru/news"
      reliability: 0.90

mc_parser:
  mode: production
  lookback_days: 21
  poll_interval_seconds: 3600
  request_timeout_seconds: 30
  collect_timeout_seconds: 180
  max_articles_per_source_per_run: 25
  max_pages_per_run: 6
  bootstrap_articles_per_source: 0
  insert_batch_size: 20
  early_stop_known_streak: 10
  source_pause_seconds: 0.5
  backfill_pause_seconds: 2.0
  user_agent: "HackMaxMcBot/1.0"
  sources:
    pik_comfort:
      enabled: true
      listing_url: "https://pik-comfort.ru/news_all"
      reliability: 0.88
    granel:
      enabled: true
      listing_url: "https://www.ggkm.ru/news/"
      reliability: 0.80
    zhil_nagatino:
      enabled: true
      listing_url: "https://www.gbuns.ru/organizacia/novosti"
      reliability: 0.90
    gbu_portal:
      enabled: true
      listing_url: "https://gbu-zhilishchnik.ru/novosti"
      reliability: 0.78
    moek:
      enabled: true
      listing_url: "https://www.moek.ru/press/news/"
      reliability: 0.92
