# Прод-конфиг без секретов.
# Задавайте через env: MAX_BOT_TOKEN, DATABASE_PASSWORD, DATABASE_HOST, ...

app:
  name: hack-max
  debug: false

logging:
  level: INFO
  format: console

database:
  host: localhost
  port: 5432
  name: hack_max
  user: hack_max
  echo: false
  pool_size: 10
  max_overflow: 20

max:
  api_base_url: https://botapi.max.ru

api:
  host: 0.0.0.0
  port: 8000

events:
  nearby_radius_m: 3000
  city_radius_m: 30000

runtime:
  enable_bot: true
  enable_api: true
