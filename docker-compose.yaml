services:
  postgres:
    image: postgres:16-alpine
    container_name: hack_max_postgres
    environment:
      POSTGRES_DB: hack_max
      POSTGRES_USER: hack_max
      POSTGRES_PASSWORD: hack_max
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack_max -d hack_max"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Полный стек в Docker. При локальном запуске бота на хосте этот сервис не поднимайте:
  #   docker compose up -d postgres
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hack_max_bot
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: local
      # Внутри сети compose хост БД — имя сервиса, не localhost
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hack_max
      DATABASE_USER: hack_max
      DATABASE_PASSWORD: hack_max
    volumes:
      - ./src:/app/src
      - ./conf:/app/conf
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Полный стек в Docker. Локально: npm run dev в webapp/
  webapp:
    image: node:22-alpine
    container_name: hack_max_webapp
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/app
      - webapp_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    restart: unless-stopped

volumes:
  postgres_data:
  webapp_node_modules:
