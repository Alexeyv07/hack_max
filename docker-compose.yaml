services:
  postgres:
    image: postgres:16-alpine
    container_name: hack_max_postgres
    environment:
      POSTGRES_DB: hack_max
      POSTGRES_USER: hack_max
      POSTGRES_PASSWORD: hack_max
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack_max -d hack_max"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hack_max_bot
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: local
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hack_max
      DATABASE_USER: hack_max
      DATABASE_PASSWORD: hack_max
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./conf:/app/conf
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./ml/classify/rules.yaml:/app/ml/classify/rules.yaml:ro
      - ./ml/classify/artifacts:/app/ml/classify/artifacts:ro
      - ./ml/time/artifacts:/app/ml/time/artifacts:ro
      - ./ml/dedup/artifacts:/app/ml/dedup/artifacts:ro
      - ./ml/dedup/config.yaml:/app/ml/dedup/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  webapp:
    image: node:22-alpine
    container_name: hack_max_webapp
    working_dir: /app
    command: >
      sh -c "npm install --include=dev && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/app
      - webapp_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://host.docker.internal:8000
      PUBLIC_API_BASE: /api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  cloudpub:
    image: cloudpub/cloudpub:latest
    container_name: hack_max_cloudpub
    restart: unless-stopped
    network_mode: "service:webapp"
    environment:
      TOKEN: ${CLOUDPUB_TOKEN:-}
      HTTP: localhost:5173
    command: ["run"]
    volumes:
      - cloudpub_config:/home/cloudpub
    depends_on:
      - webapp

volumes:
  postgres_data:
  webapp_node_modules:
  cloudpub_config:
