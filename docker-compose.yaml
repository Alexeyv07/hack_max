services:
  postgres:
    image: postgres:16-alpine
    container_name: hack_max_postgres
    environment:
      POSTGRES_DB: hack_max
      POSTGRES_USER: hack_max
      POSTGRES_PASSWORD: hack_max
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack_max -d hack_max"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Веса classify: кладутся в образ при build (COPY artifacts) и дополнительно
  # монтируются с хоста — после переобучения достаточно перезапустить bot,
  # без полного rebuild (файл ml/classify/artifacts/importance_model.onnx).
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hack_max_bot
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: local
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hack_max
      DATABASE_USER: hack_max
      DATABASE_PASSWORD: hack_max
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    ports:
      # API из main (runtime.enable_api) — для webapp proxy / локального :8000
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./conf:/app/conf
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./ml/classify/rules.yaml:/app/ml/classify/rules.yaml:ro
      - ./ml/classify/artifacts:/app/ml/classify/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  webapp:
    image: node:22-alpine
    container_name: hack_max_webapp
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/app
      - webapp_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      # По умолчанию API на хосте (python -m main). Для bot в compose:
      #   API_PROXY_TARGET=http://bot:8000
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: hack_max_ngrok
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NGROK_AUTHTOKEN: ${NGROK:?Set NGROK=... in .env (ngrok authtoken)}
    command:
      - "http"
      - "${NGROK_UPSTREAM:-webapp:5173}"
      - "--request-header-add"
      - "ngrok-skip-browser-warning:true"
      - "--log=stdout"
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - webapp

volumes:
  postgres_data:
  webapp_node_modules:
