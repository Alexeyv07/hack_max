# PyTorch fine-tune importance (KAN-13 / KAN-27)
# Данные: python ml/classify/build_train_from_sources.py

model_name: cointegrated/rubert-tiny2
max_length: 128
train_path: ml/classify/data/train.jsonl
val_path: ml/classify/data/val.jsonl
test_path: null
val_ratio: 0.15
seed: 27

# RTX 3060 4GB
epochs: 6
train_batch_size: 16
eval_batch_size: 32
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.08
max_grad_norm: 1.0
gradient_accumulation_steps: 1
fp16: true
dataloader_num_workers: 0

class_weight: balanced
early_stopping_patience: 3

output_dir: ml/classify/checkpoints/rubert_importance
export_onnx: true
onnx_path: ml/classify/artifacts/importance_model.onnx
tokenizer_dir: ml/classify/artifacts/tokenizer

logging_steps: 20
save_total_limit: 2
