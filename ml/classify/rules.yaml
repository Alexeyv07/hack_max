# Доп. keywords для parser_common.classify (substring match после normalize).
# Мержатся с дефолтами в classify.py. Disaster проверяется раньше important.
#
# Не дублируй то, что уже в коде:
#   disaster: катастроф, цунами, землетрясен, взрыв, теракт, ядерн,
#             чрезвычай, эвакуац, обрушен
#   important: отключили воду/свет/газ, отключение воды/электричеств,
#              авария, прорыв, пожар, затоп, ремонт теплосети,
#              без отопления, канализац
#
# Слишком короткие/общие стемы (мчс, жертв, чс) лучше не класть — ловят криминал и ленту.

disaster:
  # хим / радиация
  - химическ
  - радиац
  - аммиак
  - утечка хлора
  - хлора на
  # гидро / инфраструктура ЧС
  - прорыв дамб
  - прорыв плотин
  - режим чс
  - введён режим чс
  - введен режим чс
  # массовые угрозы
  - под завалами
  - захват заложник
  - заложников
  - массовое отравление
  - массовое убийств
  # транспорт / техноген
  - сход поезда
  - столкновение поезд
  - пожар на нефтебаз
  - нефтебаз
  - башенного крана
  - лесной пожар
  - лесного пожара
  # природа / сейсмика (добавки к дефолтам)
  - магнитуд
  - толчки ощуща
  - ураган
  - смерч
  - наводнен
  - паводок
  - селевой
  # оборона / укрытия (городская ЧС-повестка)
  - противорадиац
  - объявлена срочная эвакуац

important:
  # вода / тепло / электричество / газ
  - отключили горячую воду
  - отключение горячей
  - отключение газа
  - отключение света
  - отключение электричества
  - без воды
  - без света
  - без газа
  - без горячей воды
  - не будет воды
  - не будет газа
  - не будет света
  - не будет электричества
  - плановые работы на сетях
  - утечка газа
  - запах газа
  - теплотрасс
  - теплосет
  - горячего водоснабжен
  - холодного водоснабжен
  - водоканал
  - прорвало труб
  - засор
  # локальные инциденты (не городская ЧС)
  - пожар в квартир
  - пожар в подвал
  - пожар в подъезд
  - задымлен
  - дым в подъезд
  - затопление подвал
  - затопило
  # дороги / доступ
  - перекрыли дорог
  - перекрыта одна полос
  - перекрыт проезд
  - дтп на
  - авария на тепло
  - аварийная служб
