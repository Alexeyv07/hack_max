# Доп. keywords для parser_common.classify (substring match после normalize).
# Мержатся с дефолтами в classify.py.
# Порядок правил: disaster → urgent (cat.1) → important (cat.2) → else 3.
#
# Не дублируй то, что уже в коде (см. _DEFAULT_* в classify.py).
# Слишком короткие/общие стемы (мчс, жертв, чс) лучше не класть.

disaster:
  # хим / радиация
  - химическ
  - радиац
  - аммиак
  - утечка хлора
  - хлора на
  # гидро / инфраструктура ЧС
  - прорыв дамб
  - прорыв плотин
  - режим чс
  - введён режим чс
  - введен режим чс
  # массовые угрозы
  - под завалами
  - захват заложник
  - заложников
  - массовое отравление
  - массовое убийств
  # транспорт / техноген
  - сход поезда
  - столкновение поезд
  - пожар на нефтебаз
  - нефтебаз
  - башенного крана
  - лесной пожар
  - лесного пожара
  # природа / сейсмика
  - магнитуд
  - толчки ощуща
  - ураган
  - смерч
  - наводнен
  - паводок
  - селевой
  # оборона / укрытия
  - противорадиац
  - объявлена срочная эвакуац
  - ракетн опасн
  - воздушн тревог

# Срочная локальная опасность → importance=1, disaster_flag=false
urgent:
  - запах газа
  - утечка газа
  - пахнет газом
  - задымлен
  - дым в подъезд
  - дым в квартир
  - пожар в квартир
  - пожар в подвал
  - пожар в подъезд
  - идёт пожар
  - горит квартир
  - заливает квартир
  - прорвало стояк
  - застряли в лифте
  - люди в лифте
  - угрожает нож
  - размахивает нож
  - избивают
  - взламывают дверь
  - оборванный провод
  - оборванн провод
  - бросается на детей
  - собака нападает

important:
  # вода / тепло / электричество / газ (бытовые ограничения)
  - отключили горячую воду
  - отключение горячей
  - отключение газа
  - отключение света
  - отключение электричества
  - без воды
  - без света
  - без газа
  - без горячей воды
  - не будет воды
  - не будет газа
  - не будет света
  - не будет электричества
  - плановые работы на сетях
  - теплотрасс
  - теплосет
  - горячего водоснабжен
  - холодного водоснабжен
  - водоканал
  - прорвало труб
  - засор
  - опрессовк
  - не работает лифт
  - лифт не работает
  - домофон
  - собрание собственник
  # дороги / доступ
  - перекрыли дорог
  - перекрыта одна полос
  - перекрыт проезд
  - перекрыт въезд
  - дтп на
  - авария на тепло
  - аварийная служб
  - уберите машин
  - штормов предупрежд
  - экстренное предупрежден
