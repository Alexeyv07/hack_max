name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: alexeyv07
  MODELS_RELEASE: models

jobs:
  build-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: hack_max-postgres
            context: .
            dockerfile: docker/postgres/Dockerfile
            needs_onnx: false
          - name: bot
            image: hack_max-bot
            context: .
            dockerfile: Dockerfile
            needs_onnx: true
          - name: webapp
            image: hack_max-webapp
            context: .
            dockerfile: deploy/webapp/Dockerfile
            needs_onnx: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ONNX from Release ${{ env.MODELS_RELEASE }}
        if: matrix.needs_onnx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/onnx
          gh release download "${MODELS_RELEASE}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/onnx \
            --pattern "*.onnx"

          test -f /tmp/onnx/importance_model.onnx
          test -f /tmp/onnx/time_window_model.onnx
          test -f /tmp/onnx/embed_model.onnx

          mkdir -p ml/classify/artifacts ml/time/artifacts ml/dedup/artifacts
          cp /tmp/onnx/importance_model.onnx ml/classify/artifacts/
          cp /tmp/onnx/time_window_model.onnx ml/time/artifacts/
          cp /tmp/onnx/embed_model.onnx ml/dedup/artifacts/

          ls -lh ml/classify/artifacts/*.onnx ml/time/artifacts/*.onnx ml/dedup/artifacts/*.onnx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Pull без docker login: пакет публичный.
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # user-owned packages (github.com/Alexeyv07/...)
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PACKAGE}" \
            -f visibility=public
