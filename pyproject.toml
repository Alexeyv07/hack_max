[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hack-max"
version = "0.1.0"
description = "Умный город: бот и webapp для мессенджера Max"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "maxapi>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "pre-commit>=4.0,<5",
]

[project.scripts]
hack-max-bot = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # длину строк контролирует форматтер
]

[tool.ruff.lint.isort]
known-first-party = ["project", "auth", "main"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
