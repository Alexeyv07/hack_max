[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hack-max"
version = "0.1.0"
description = "Умный город: бот и webapp для мессенджера Max"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "maxapi>=1.0,<2",
    "alembic>=1.14,<2",
    "rapidfuzz>=3.14,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]
ml-runtime = [
    # инференс classify в Docker / prod (без torch)
    "onnxruntime>=1.19,<2",
    "transformers>=4.44,<5",
]
ml = [
    "onnxruntime>=1.19,<2",
    "transformers>=4.44,<5",
    "scikit-learn>=1.5,<2",
    "datasets>=2.21,<4",
    "accelerate>=0.34,<2",
    "onnx>=1.16,<2",
    # torch ставь отдельно под CUDA, см. AGENTS.md / ml/classify/README.md
]


[project.scripts]
hack-max-bot = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # длину строк контролирует форматтер
]

[tool.ruff.lint.isort]
known-first-party = ["project", "auth", "address", "events", "chats", "chat_link", "parser_common", "parse_news", "main", "max"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]